<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Plantilla en blanco</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style id="marca">
/* MARCA:INICIO (lo reemplaza scripts/nuevo-proyecto.mjs con marca/marca.css) */
:root {
  --fondo: #111318;
  --fondo-hondo: #0a0b0e;
  --superficie: #1b1e25;
  --superficie-alta: #252a33;
  --texto: #f3f1ec;
  --texto-suave: #9aa0aa;
  --acento: #7aa2ff;
  --acento-2: #ffc857;
  --negativo: #ff6b5e;
  --fuente-titulos: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
  --fuente-texto: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
  --fuente-mono: "SF Mono", Menlo, Consolas, monospace;
  --peso-titulos: 800;
  --radio: 28px;
}
/* MARCA:FIN */
  </style>
  <style>
    /* Guías de zona segura de reel: pon "block" para verlas en preview/snapshot y vuelve a "none" antes de renderizar. */
    :root { --guias: none; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--texto); font-family: var(--fuente-texto);
      background: radial-gradient(120% 80% at 50% 40%, var(--fondo) 50%, var(--fondo-hondo) 100%); }
    /* Todo lo que se lee va centrado en x = 540 y dentro de la zona segura de reel (x 185–895 si va centrado, y 220–1470). */
    .etiqueta { position: absolute; left: 185px; width: 710px; top: 640px; text-align: center; font-family: var(--fuente-mono);
      font-size: 30px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); }
    .titular { position: absolute; left: 185px; width: 710px; top: 700px; margin: 0; text-align: center; font-family: var(--fuente-titulos);
      font-weight: var(--peso-titulos); font-size: 104px; line-height: 1.02; letter-spacing: -0.03em; }
    .titular em { font-style: normal; color: var(--acento); }
    .bajada { position: absolute; left: 185px; width: 710px; top: 1110px; text-align: center; font-size: 40px; line-height: 1.3; color: var(--texto-suave); }
    #guias { display: var(--guias); position: absolute; inset: 0; pointer-events: none;
      --r: linear-gradient(rgba(255, 40, 40, .35), rgba(255, 40, 40, .35));
      background: var(--r) 0 0 / 1080px 220px no-repeat, var(--r) 0 1470px / 1080px 450px no-repeat,
        var(--r) 0 220px / 35px 1250px no-repeat, var(--r) 1045px 220px / 35px 1250px no-repeat, var(--r) 910px 1160px / 135px 310px no-repeat; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <div class="clip etiqueta" id="etiqueta" data-start="0" data-duration="4" data-track-index="0">Tu primer vídeo</div>
    <h1 class="clip titular" id="titular" data-start="0" data-duration="4" data-track-index="1">Hecho <em>hablando</em> con tu IA</h1>
    <div class="clip bajada" id="bajada" data-start="0" data-duration="4" data-track-index="2">Cambia este texto, los colores o pídele otra cosa.</div>
    <div class="clip" id="guias" data-start="0" data-duration="4" data-track-index="9"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#etiqueta", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);
    tl.fromTo("#titular", { opacity: 0, y: 50, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0.35);
    tl.fromTo("#bajada", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.9);
    tl.to("#titular", { scale: 1.03, duration: 2.6, ease: "sine.inOut" }, 1.2);   // movimiento secundario: nada se queda muerto
    tl.set({}, {}, 4);   // la duración de la composición = la del timeline
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
