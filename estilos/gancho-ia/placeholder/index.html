<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Placeholder: clip "generado" de una torre de bloques</title>
  <!-- PLACEHOLDER hecho por código: hace de "clip generado con IA de vídeo" para que el ejemplo renderice sin gastar.
       En un vídeo real, este clip lo genera una IA de vídeo con tu cuenta (de pago) y este archivo no se usa.
       Escena: una torre de bloques de madera; un dedo empieza a sacar el bloque de abajo; la torre se inclina
       (cámara lenta con acercamiento) y al final se cae. Tres tiempos en un solo plano: 0–1,2 s tiempo real,
       1,2–2,6 s cámara lenta hacia la tensión, 2,6–4 s desenlace. Look de móvil: cámara en mano y tonos cálidos.
       Los colores van fijos a propósito: imita metraje, no lleva la marca. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2b2420; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #escena { position: absolute; inset: 0; transform-origin: 540px 1000px; }
    #pared { position: absolute; inset: 0; background: radial-gradient(90% 60% at 45% 30%, #8a7a6c 0%, #5d5047 55%, #3a312b 100%); }
    #mesa { position: absolute; left: -200px; right: -200px; top: 1310px; bottom: -200px;
      background: linear-gradient(180deg, #a87a52 0%, #8e6440 40%, #6c4a2f 100%); }
    #mesa::after { content: ""; position: absolute; inset: 0; opacity: 0.25;
      background: repeating-linear-gradient(178deg, rgba(0,0,0,0.25) 0 3px, transparent 3px 26px); }
    .bloque { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 300px; height: 104px; border-radius: 8px;
      background: linear-gradient(180deg, #e2b880 0%, #c9955c 100%); box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15), inset 0 3px 0 rgba(255,255,255,0.25); }
    .bloque::after { content: ""; position: absolute; inset: 10px 14px; border-radius: 4px; opacity: 0.35;
      background: repeating-linear-gradient(90deg, rgba(120,70,30,0.5) 0 2px, transparent 2px 22px); }
    #sombra { position: absolute; left: 330px; top: 1300px; width: 420px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.35); filter: blur(14px); }
    #dedo { position: absolute; left: 0; top: 0; width: 420px; height: 96px; border-radius: 48px;
      background: linear-gradient(180deg, #e8b597 0%, #c98c6e 100%); box-shadow: inset 6px 0 0 rgba(255,255,255,0.15); }
    #dedo::before { content: ""; position: absolute; left: 14px; top: 18px; width: 58px; height: 58px; border-radius: 40% 50% 50% 40%; background: #f1cdbb; opacity: 0.7; }
    #vineta { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <div id="escena" class="clip" data-start="0" data-duration="4" data-track-index="0">
      <div id="pared"></div><div id="mesa"></div><div id="sombra"></div>
      <div id="torre"></div>
      <div id="dedo"></div>
    </div>
    <div id="vineta" class="clip" data-start="0" data-duration="4" data-track-index="1"></div>
  </div>
  <script>
    (function () {
      const DUR = 4, N = 6, BW = 300, BH = 104, BASE_Y = 1316, X0 = 390;
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const io = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const hs = (i, s) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v); };
      const torre = document.getElementById("torre");
      const bloques = Array.from({ length: N }, () => { const b = document.createElement("div"); b.className = "bloque"; torre.appendChild(b); return b; });
      const dedo = document.getElementById("dedo"), escena = document.getElementById("escena");
      function render(t) {
        // cámara en mano (seno sembrado) + acercamiento lento hacia la tensión
        const push = 1 + 0.32 * io(clamp01((t - 1.2) / 1.4));
        const sx = 6 * Math.sin(t * 7.1) + 3 * Math.sin(t * 13.3), sy = 5 * Math.sin(t * 6.3 + 1);
        escena.style.transform = `translate(${sx}px, ${sy}px) scale(${push})`;
        // el dedo entra (tiempo real) y saca el bloque de abajo despacio
        const entra = io(clamp01(t / 1.2)), saca = clamp01((t - 1.2) / 1.4);
        const fuera = 110 * Math.pow(saca, 1.4);
        dedo.style.transform = `translate(${lerp(1120, X0 + BW - 20, entra) + fuera}px, ${BASE_Y - BH + 4}px)`;
        // inclinación creciente (pivote en la esquina inferior izquierda de la torre) y caída desde 2,6 s
        const incl = 10 * Math.pow(saca, 2.2);
        bloques.forEach((b, i) => {
          let x = X0 + (i === 0 ? fuera : 0), y = BASE_Y - BH * (i + 1), r = 0;
          if (i > 0) {   // los de arriba giran juntos alrededor del pivote
            const px = X0 + fuera, py = BASE_Y - BH,   // la torre bascula sobre el canto del bloque que se sale
            th = -incl * Math.PI / 180, dx = x - px, dy = y - py;
            x = px + dx * Math.cos(th) - dy * Math.sin(th); y = py + dx * Math.sin(th) + dy * Math.cos(th);
            r = -incl;
          }
          const tc = t - 2.6 - (N - 1 - i) * 0.04;   // desenlace: caen escalonados, con giro sembrado
          if (tc > 0 && i > 0) {
            x += -(90 + 120 * hs(i, 3)) * tc; y += 1500 * tc * tc; r += -(60 + 90 * hs(i, 5)) * Math.min(tc, 0.9);
            y = Math.min(y, BASE_Y - 70 - 40 * hs(i, 9));   // quedan tirados sobre la mesa
          }
          b.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
        });
      }
      function lerp(a, b, k) { return a + (b - a) * k; }
      const P = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(P.t) }, 0);
      tl.set({}, {}, DUR);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    })();
  </script>
</body>
</html>
