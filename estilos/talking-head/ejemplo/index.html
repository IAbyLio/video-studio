<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Ejemplo: cara a cámara</title>
  <!-- Estilo "cara a cámara": tu vídeo (aquí, una persona de relleno hecha por código) con captions palabra a palabra,
       cámara viva y tres modos de cara: pantalla completa → ventana chica abajo a la izquierda → mitad superior.
       Para usarlo con tu grabación: reemplaza assets/persona.mp4 (vertical 1080x1920, ya cortado; ver el módulo
       editar-lo-que-grabas) y las palabras de PALABRAS por las de tu transcript (scripts/generate-captions.mjs). -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style id="marca">
/* MARCA:INICIO (lo reemplaza scripts/nuevo-proyecto.mjs con marca/marca.css) */
:root {
  --fondo: #111318;
  --fondo-hondo: #0a0b0e;
  --superficie: #1b1e25;
  --superficie-alta: #252a33;
  --texto: #f3f1ec;
  --texto-suave: #9aa0aa;
  --acento: #7aa2ff;
  --acento-2: #ffc857;
  --negativo: #ff6b5e;
  --fuente-titulos: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
  --fuente-texto: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
  --fuente-mono: "SF Mono", Menlo, Consolas, monospace;
  --peso-titulos: 800;
  --radio: 28px;
}
/* MARCA:FIN */
  </style>
  <style>
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo-hondo); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--fuente-texto); color: var(--texto); }
    /* #cam envuelve todo el mundo (fondo, cara, gráficos, captions); la viñeta queda fuera: es la lente */
    #cam { position: absolute; inset: 0; transform-origin: 540px 900px; }
    #fondo { position: absolute; inset: 0; background: radial-gradient(110% 70% at 50% 35%, var(--superficie) 0%, var(--fondo) 55%, var(--fondo-hondo) 100%); }
    #rejilla { position: absolute; inset: -120px; opacity: .5;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 92px 92px; }
    /* la cara: se anima el wrapper, NUNCA el <video> (congela fotogramas) */
    #cara { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
    #cara video { width: 1080px; height: 1920px; object-fit: cover; filter: contrast(1.06) saturate(1.06); }
    #marco-pip { position: absolute; left: 60px; top: 1048px; width: 378px; height: 400px; border-radius: 34px; opacity: 0;
      box-shadow: 0 0 0 4px var(--acento), 0 24px 60px rgba(0,0,0,.5); }
    /* modo ventana: el gráfico central ocupa el escenario */
    #heroe { position: absolute; left: 185px; width: 710px; top: 430px; text-align: center; }
    #heroe .num { font-family: var(--fuente-titulos); font-weight: var(--peso-titulos); font-size: 300px; line-height: .9; letter-spacing: -.05em;
      background: linear-gradient(180deg, var(--texto) 20%, var(--acento) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #heroe .lbl { margin-top: 20px; font-size: 44px; color: var(--texto-suave); }
    /* modo mitad superior: tarjeta abajo */
    #tarjeta { position: absolute; left: 185px; width: 710px; top: 1010px; height: 420px; box-sizing: border-box; padding: 44px 52px; border-radius: var(--radio);
      background: var(--superficie); border-top: 4px solid var(--acento); box-shadow: 0 -16px 40px rgba(0,0,0,.45); opacity: 0; }
    #tarjeta h3 { margin: 0 0 26px; font-family: var(--fuente-titulos); font-size: 50px; }
    #tarjeta .fila { display: flex; align-items: center; gap: 20px; font-size: 34px; margin: 14px 0; color: var(--texto-suave); }
    #tarjeta .ok { width: 40px; height: 40px; border-radius: 50%; background: var(--acento); flex: none; }
    /* captions "natural": 1-3 palabras, centradas en x = 540, la clave resaltada */
    .cap { position: absolute; left: 185px; width: 710px; text-align: center; font-family: var(--fuente-titulos); font-weight: var(--peso-titulos);
      font-size: 74px; line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 24px rgba(0,0,0,.55); }
    .cap .w { display: inline-block; opacity: 0; }
    .cap .clave { color: var(--acento-2); }
    #vineta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <div id="cam">
      <div id="fondo"></div>
      <div id="rejilla"></div>
      <div id="cara">
      <video id="video-cara" src="assets/persona.mp4" muted playsinline data-start="0" data-duration="6" data-track-index="2"></video>
      </div>
      <div id="heroe" style="opacity:0"><div class="num">3×</div><div class="lbl">más rápido que editar a mano</div></div>
      <div id="tarjeta"><h3>Qué hace por ti</h3>
        <div class="fila"><span class="ok"></span>Corta silencios y tomas</div>
        <div class="fila"><span class="ok"></span>Subtítulos palabra a palabra</div>
        <div class="fila"><span class="ok"></span>Te avisa antes de renderizar</div></div>
      <div id="marco-pip"></div>
      <div class="cap" id="cap1" style="top:1160px"></div>
      <div class="cap" id="cap2" style="top:1160px"></div>
      <div class="cap" id="cap3" style="top:870px"></div>
    </div>
    <div id="vineta" class="clip" data-start="0" data-duration="6" data-track-index="3"></div>
  </div>
  <script>
    // Palabras con su instante (en tu proyecto salen del transcript). [texto, inicio, fin, clave?]
    const BLOQUES = [
      ["#cap1", [["Esto", 0.35], ["lo", 0.62], ["editó", 0.8, 1]]],
      ["#cap2", [["mi", 1.35], ["IA", 1.55, 1]]],
      ["#cap3", [["y", 4.45], ["me", 4.6], ["avisó", 4.82, 1]]],
    ];
    const tl = gsap.timeline({ paused: true });
    for (const [sel, ws] of BLOQUES) {
      document.querySelector(sel).innerHTML = ws.map(([w, , k]) => `<span class="w${k ? " clave" : ""}">${w}</span>`).join(" ");
      ws.forEach(([, t], i) => tl.fromTo(`${sel} .w:nth-child(${i + 1})`, { opacity: 0, y: 26, scale: 0.92, filter: "blur(6px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, t));
    }
    tl.to("#cap1", { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 1.25);   // salida = transición
    tl.to("#cap2", { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 2.05);
    tl.to("#cap3", { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 5.7);

    // Modos de cara (fuente vertical 1080x1920, transform-origin 0 0)
    // clipPath recorta en coordenadas de la fuente: en ventana queda cabeza y hombros; en mitad, nada por debajo de y 960.
    const FULL = { x: 0, y: 0, scale: 1, clipPath: "inset(0px 0px 0px 0px round 0px)" };
    const PIP = { x: 60, y: 915, scale: 0.35, clipPath: "inset(380px 0px 400px 0px round 96px)" };
    const MITAD = { x: 0, y: -300, scale: 1, clipPath: "inset(0px 0px 660px 0px round 0px)" };
    tl.set("#cara", FULL, 0);
    tl.to("#cara", { ...PIP, duration: 0.5, ease: "expo.inOut" }, 2.05);     // 0,2 s antes de la escena
    tl.to("#marco-pip", { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.4);
    tl.fromTo("#heroe", { opacity: 0, scale: 1.6, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power4.in" }, 2.45);
    tl.to("#heroe", { opacity: 0, y: -80, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 3.95);
    tl.to("#marco-pip", { opacity: 0, duration: 0.2 }, 3.9);
    tl.to("#cara", { ...MITAD, duration: 0.5, ease: "expo.inOut" }, 4.0);
    tl.fromTo("#tarjeta", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.3);
    tl.from("#tarjeta .fila", { opacity: 0, x: -30, duration: 0.3, stagger: 0.18, ease: "power2.out" }, 4.6);

    // Cámara viva: deriva lenta + golpe en las palabras clave + vuelta al reposo entre fases
    tl.fromTo("#cam", { scale: 1 }, { scale: 1.02, duration: 0.8, ease: "none" }, 0);
    tl.to("#cam", { scale: 1.09, duration: 0.3, ease: "back.out(2.2)" }, 0.8);
    tl.to("#cam", { scale: 1.1, duration: 0.9, ease: "none" }, 1.1);
    tl.to("#cam", { scale: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.0);
    tl.to("#cam", { scale: 1.06, duration: 0.3, ease: "back.out(2.2)" }, 2.45);
    tl.to("#cam", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 3.95);
    tl.to("#rejilla", { x: 46, y: 46, duration: 6, ease: "none" }, 0);
    tl.set({}, {}, 6);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
