<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- Persona de RELLENO hecha por código: hace de "tu vídeo a cámara" en los ejemplos de talking head, pantalla
       partida y texto detrás del sujeto. No es nadie. La reemplazas por tu grabación (o tu avatar).
       Se renderiza con estilos/_material/generar.sh: una vez con fondo (persona.mp4) y otra sin fondo
       (persona-recorte.webm, con transparencia), como si ya hubieras recortado a la persona. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --con-fondo: 1; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    /* fondo tipo habitación: pared con degradado, una ventana desenfocada y una planta */
    #fondo { position: absolute; inset: 0; opacity: var(--con-fondo);
      background: radial-gradient(70% 40% at 72% 30%, #d9cbb4 0%, rgba(217,203,180,0) 70%),
                  linear-gradient(180deg, #8d8577 0%, #6f685d 60%, #4c473f 100%); }
    #ventana { position: absolute; left: 640px; top: 260px; width: 330px; height: 520px; border-radius: 18px;
      background: linear-gradient(160deg, #e9edf0, #b9c6cf); filter: blur(10px); opacity: calc(0.85 * var(--con-fondo)); }
    #planta { position: absolute; left: 90px; top: 980px; width: 220px; height: 520px; filter: blur(8px); opacity: var(--con-fondo);
      background: radial-gradient(50% 35% at 50% 30%, #4f6b4a 0%, #3a5236 60%, rgba(0,0,0,0) 72%); }
    /* la persona: cabeza, cuello y torso con jersey; se balancea un poco y "habla" con la mandíbula */
    #persona { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 1900px; }
    .pieza { position: absolute; }
    #torso { left: 170px; top: 1180px; width: 740px; height: 900px; border-radius: 360px 360px 40px 40px;
      background: linear-gradient(180deg, #3d5a80 0%, #2c4463 100%); box-shadow: inset 0 30px 60px rgba(255,255,255,.08); }
    #cuello { left: 470px; top: 1040px; width: 140px; height: 200px; border-radius: 40px; background: linear-gradient(90deg, #c99a7c, #d8aa8b, #c99a7c); }
    #cabeza { left: 360px; top: 600px; width: 360px; height: 470px; border-radius: 48% 48% 46% 46% / 42% 42% 58% 58%;
      background: radial-gradient(60% 55% at 42% 40%, #e7bc9c 0%, #d6a886 60%, #c39070 100%); }
    #pelo { left: 345px; top: 560px; width: 390px; height: 230px; border-radius: 200px 200px 60px 60px; background: #3b2f2a; }
    .ojo { top: 805px; width: 34px; height: 22px; border-radius: 50%; background: #2a211d; }
    #ojoI { left: 465px; } #ojoD { left: 581px; }
    #boca { left: 495px; top: 935px; width: 90px; height: 16px; border-radius: 0 0 50px 50px; background: #7d3f37; transform-origin: 50% 0; }
    #etiqueta { position: absolute; left: 0; right: 0; top: 1600px; text-align: center; font: 600 30px "Helvetica Neue", Arial, sans-serif;
      letter-spacing: .12em; color: rgba(255,255,255,.55); opacity: var(--con-fondo); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <div id="fondo" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
    <div id="ventana" class="clip" data-start="0" data-duration="6" data-track-index="1"></div>
    <div id="planta" class="clip" data-start="0" data-duration="6" data-track-index="2"></div>
    <div id="persona" class="clip" data-start="0" data-duration="6" data-track-index="3">
      <div class="pieza" id="torso"></div><div class="pieza" id="cuello"></div><div class="pieza" id="cabeza"></div>
      <div class="pieza" id="pelo"></div><div class="pieza ojo" id="ojoI"></div><div class="pieza ojo" id="ojoD"></div><div class="pieza" id="boca"></div>
    </div>
    <div id="etiqueta" class="clip" data-start="0" data-duration="6" data-track-index="4">PERSONA DE RELLENO · TU VÍDEO VA AQUÍ</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // balanceo suave del cuerpo (seno de t: determinista)
    const P = { t: 0 };
    tl.to(P, { t: 6, duration: 6, ease: "none", onUpdate() {
      const t = P.t;
      gsap.set("#persona", { rotation: 1.2 * Math.sin(t * 1.3), y: 6 * Math.sin(t * 2.1) });
      // "habla": la boca se abre a ritmo de sílabas, con pausas en 2.2–2.6 s y 4.4–4.8 s
      const hablando = !((t > 2.2 && t < 2.6) || (t > 4.4 && t < 4.8) || t < 0.3);
      const ap = hablando ? Math.max(0, Math.sin(t * 13) * 0.5 + Math.sin(t * 7.3) * 0.5) : 0;
      gsap.set("#boca", { scaleY: 1 + ap * 2.6 });
      // parpadeo cada ~2,7 s
      const b = (t % 2.7) < 0.12 ? 0.15 : 1;
      gsap.set(".ojo", { scaleY: b });
    } }, 0);
    tl.set({}, {}, 6);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
