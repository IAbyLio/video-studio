<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Muñeco: demo de lip-sync</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/cara.js"></script>
  <script src="assets/poses-data.js"></script>
  <script src="assets/personaje.js"></script>
  <!-- BOCA:INICIO (lo escribe preparar-demo.mjs; sin voz, el demo usa bocas sintéticas) -->
  <!-- BOCA:FIN -->
  <script type="importmap">{ "imports": { "three": "./assets/vendor/three/three.module.min.js" } }</script>
  <style id="marca">
/* MARCA:INICIO (lo reemplaza scripts/nuevo-proyecto.mjs con marca/marca.css) */
:root {
  --fondo: #111318;
  --fondo-hondo: #0a0b0e;
  --superficie: #1b1e25;
  --superficie-alta: #252a33;
  --texto: #f3f1ec;
  --texto-suave: #9aa0aa;
  --acento: #7aa2ff;
  --acento-2: #ffc857;
  --negativo: #ff6b5e;
  --fuente-titulos: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
  --fuente-texto: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
  --fuente-mono: "SF Mono", Menlo, Consolas, monospace;
  --peso-titulos: 800;
  --radio: 28px;
}
/* MARCA:FIN */
  </style>
  <style>
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--fuente-texto); color: var(--texto); }
    #fondo { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 52%, var(--superficie-alta) 0%, var(--fondo) 62%, var(--fondo-hondo) 100%); }
    #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* textos centrados en x = 540, dentro de la zona segura de reel (y 220–1470) */
    .etiqueta { position: absolute; left: 185px; width: 710px; top: 300px; text-align: center; font-family: var(--fuente-mono);
      font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); }
    .titular { position: absolute; left: 185px; width: 710px; top: 360px; text-align: center; font-family: var(--fuente-titulos);
      font-weight: var(--peso-titulos); font-size: 76px; line-height: 1.05; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <div id="fondo" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
    <canvas id="gl" class="clip" data-start="0" data-duration="6" data-track-index="1" width="1080" height="1920"></canvas>
    <div id="etq" class="clip etiqueta" data-start="0" data-duration="6" data-track-index="2">Muñeco · lip-sync</div>
    <div id="tit" class="clip titular" data-start="0" data-duration="6" data-track-index="3">Hola, soy un muñeco hecho con código</div>
    <!-- VOZ:INICIO (lo escribe preparar-demo.mjs) -->
    <!-- VOZ:FIN -->
  </div>
  <script>
    // Timeline síncrona (contrato Hyperframes). El 3D se dibuja en window.__muneco(t), que define el módulo de abajo.
    const DUR = 6;
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const reloj = { t: 0 };
    tl.to(reloj, { t: DUR, duration: DUR, ease: "none", onUpdate: () => window.__muneco && window.__muneco(reloj.t) }, 0);
    tl.fromTo("#etq", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
    tl.fromTo("#tit", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.45);
    tl.set({}, {}, DUR);
    window.__timelines["main"] = tl;
  </script>
  <script type="module">
    import * as THREE from "three";
    const W = 1080, H = 1920, PPU = 300, FOV = 20, DUR = 6;   // 300 px por unidad en el plano z = 0
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.NeutralToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.add(Personaje.luces(THREE));
    const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 200);
    cam.position.set(0, 0, (H / 2) / (PPU * Math.tan((FOV / 2) * Math.PI / 180)));
    cam.lookAt(0, 0, 0);
    const mundo = (px, py) => ({ x: (px - W / 2) / PPU, y: (H / 2 - py) / PPU });

    // Bocas sintéticas (deterministas) para cuando no hay voz: frases de "habla" con silencios entre medio.
    function bocasSinteticas() {
      const seq = "BCDCBEAFCBDXBCAEFDCBX", cues = [[0, "X"]];
      [[1.0, 2.4], [2.9, 4.1], [4.5, 5.4]].forEach(([a, b], k) => {
        let t = a, i = k * 5;
        while (t < b) { cues.push([+t.toFixed(3), seq[i % seq.length]]); t += 0.09 + 0.04 * ((i * 7) % 3); i++; }
        cues.push([+b.toFixed(3), "X"]);
      });
      return cues;
    }
    const boca = window.MOUTH || bocasSinteticas();

    const p = Personaje.crear(THREE, { paleta: Personaje.paletaDesdeCSS() });
    const ALTO_PX = 760, escala = (ALTO_PX / PPU) / p.alto;   // protagonista: centrado en x 540, pies en y 1440
    const pies = mundo(540, 1440);
    p.grupo.scale.setScalar(escala);
    scene.add(p.grupo);
    p.setGuion({
      poses: [[0, "caminar"], [0.9, "saluda"], [2.3, "reposo"], [2.8, "senalar-der"], [4.2, "pensar"], [5.0, "celebrar"]],
      expresiones: [[0, "neutro"], [0.8, "contento"], [2.6, "neutro"], [4.1, "pensativo"], [4.9, "contento"]],
      boca, inicioAudio: 0,
    });
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const easeOut = (u) => 1 - Math.pow(1 - u, 3);
    window.__muneco = (t) => {
      const u = easeOut(clamp(t / 0.9, 0, 1));                 // entra caminando desde la izquierda
      p.grupo.position.set(pies.x - 1.4 * (1 - u), pies.y, 0);
      p.grupo.rotation.y = (30 * (1 - easeOut(clamp((t - 0.6) / 0.5, 0, 1)))) * Math.PI / 180;
      p.render(t);
      renderer.render(scene, cam);
    };
    window.__muneco(window.__timelines["main"].time());
  </script>
</body>
</html>
